[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pepper-research"
version = "0.1.0"
description = "Research pipelines for Pepper scene graph experiments."
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "datasets>=2.19",
  "matplotlib>=3.8",
]

[project.scripts]
experiments = "experiments.cli.main:main"
