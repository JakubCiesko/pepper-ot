name: "scene_graph_benchmark"
seed: 42

paths:
  images_dir: "data/images"
  output_root: "research/artifacts"
  detections_file: "detections.json"
  descriptions_file: "descriptions.json"
  vocabulary_candidates_file: "vocabulary_candidates.json"
  vocabulary_final_file: "vocabulary_final.json"
  draft_scene_graph_file: "draft_scene_graph.json"
  context_rot_file: "context_rot.json"

description_model:
  provider: "openai"
  model_id: "gpt-5-nano-2025-08-07"
  structured_mode: "provider_native"

vocabulary_model:
  provider: "openai"
  model_id: "gpt-5-nano-2025-08-07"
  structured_mode: "provider_native"

draft_sgg_model:
  provider: "openai"
  model_id: "gpt-5-nano-2025-08-07"
  structured_mode: "provider_native"

detection:
  enabled: true
  backend: "rt_detr"
  batch_size: 4

descriptions:
  enabled: true
  batch_size: 8
  max_concurrent_batches: 2
  system_prompt: "Describe the scene in detail. Mention object attributes and relations."
  user_prompt_template: "Detected objects: {objects}\nProvide one long structured scene description."

vocabulary:
  enabled: true
  batch_size: 16
  max_concurrent_batches: 2
  predicates_target: 50
  attributes_target: 25
  extract_system_prompt: "Extract practical predicates and attributes from captions for scene graph usage."
  consolidate_predicates_prompt: "Consolidate to broad practical predicates, normalized with underscore."
  consolidate_attributes_prompt: "Consolidate to broad practical attributes, normalized with underscore and is_ prefix where natural."

draft_scene_graph:
  enabled: true
  batch_size: 8
  max_concurrent_batches: 2
  system_prompt: "Return valid JSON with relationships list of {sub, rel, obj}. Use object IDs only."
  user_prompt_template: "Objects: {objects}\nAllowed vocabulary: {vocabulary}\nCaption: {caption}"

context_rot:
  enabled: true
  min_vocab_size: 10
  step: 5
  strategy: "llm_drop"
  rounds_per_size: 1

prompting:
  include_detection_labels_in_descriptions: true
  include_caption_in_sgg_prompt: true
