name: PepperContextRotListVocab
base_config: eval_sgg_server_like_base.yaml

reuse_artifacts:
  from_run: "research/artifacts/human_eval/vocab/eval_draft_sgg_frozen_vocab_v1"
  files:
    - "detections.json"
    - "descriptions.json"
    - "ground_truth_scene_graph.json"
    - "vocabulary_final.json"

common_overrides:
  name: PepperContextRotListVocab
  paths:
    images_dir: "data/images/eval"
    output_root: "research/artifacts/experiments/context_rot_list_vocab"
  descriptions:
    enabled: false
  vocabulary:
    enabled: false
  context_rot:
    enabled: true
    levels_file: "research/configs/vocab/context_rot_levels.yaml"
    evaluate_against_ground_truth: true
  evaluation:
    enabled: false
    keyspace: "gt_only"
  prompting:
    include_caption_in_sgg_prompt: true
  draft_scene_graph:
    enabled: false
    max_concurrent_batches: 2
    vocab_mode: "list"
    use_som_image: true
    visual_mode: "som"
    som_show_bbox: true
    som_show_labels: true
    som_show_mask: false
    som_show_polygon: false
    som_mask_backend: grabcut
    som_mask_opacity: 0.35
    som_grab_cut_scale: 0.80
    som_grab_cut_iter_count: 10
    som_use_roi_grab_cut: true
    som_max_mask_workers: 4

variants:
  # - name: geminiR_context_rot_list_vocab
  #   overrides:
  #     experiment_id: geminiR_context_rot_list_vocab
  #     draft_sgg_model:
  #       provider: "gemini"
  #       model_id: "gemini-robotics-er-1.6-preview"
  #       structured_mode: "provider_native"
  - name: gpt5_context_rot_list_vocab
    overrides:
      experiment_id: gpt5_context_rot_list_vocab
      draft_sgg_model:
        provider: "openai"
        model_id: "gpt-5.5-2026-04-23"
        structured_mode: "provider_native"
