name: "scene_graph_benchmark"
seed: 42

paths:
  images_dir: "data/images"
  output_root: "research/artifacts"
  detections_file: "detections.json"
  descriptions_file: "descriptions.json"
  vocabulary_candidates_file: "vocabulary_candidates.json"
  vocabulary_final_file: "vocabulary_final.json"
  draft_scene_graph_file: "draft_scene_graph.json"
  context_rot_file: "context_rot.json"

description_model:
  provider: "openai"
  model_id: "gpt-5-nano-2025-08-07"
  structured_mode: "provider_native"

vocabulary_model:
  provider: "openai"
  model_id: "gpt-5-nano-2025-08-07"
  structured_mode: "provider_native"

draft_sgg_model:
  provider: "openai"
  model_id: "gpt-5-nano-2025-08-07"
  structured_mode: "provider_native"

detection:
  enabled: false
  backend: "rf_detr"
  batch_size: 4
  max_image_size: 1024

descriptions:
  enabled: false
  max_image_size: 1024
#  batch_size: 32
  max_concurrent_batches: 64
  system_prompt: >
    You are an expert in computer vision and scene graph generation.
    Produce a precise, exhaustive, and objective description of the provided image.
    The description must include all visible objects, their attributes, spatial
    relationships, interactions, and contextual details.
    Use clear and unambiguous language suitable for image annotation which
    will later be used as a source for scene graph generation.
    Opt for terms which can be later employed in conversations.
    Avoid speculation and hallucinations. Only describe what is visually observable.
    Focus mainly on the objects from the provided list of objects.
  user_prompt_template: >
    Provide a detailed, one-page description of the image.

    Ensure the description includes:
    - Objects
    - Attributes such as color, size, material, and state
    - Comparative attributes (e. g., bigger than, smaller than)
    - Spatial relationships (e.g., on, under, next to, behind)
    - Functional interactions (e.g., holding, sitting on, looking at)
    - Environmental context

    Use precise and factual language suitable for scene graph extraction.
    Focus on these objects: {objects}

vocabulary:
  enabled: true
  #batch_size: 32
  max_concurrent_batches: 64
  predicates_target: 50
  attributes_target: 25
  extract_system_prompt: >
    Extract practical, conversation-relevant predicates and attributes from captions for scene graph extraction task.
    Focus mainly on predicates and attributes relevant to the provided list of detected objects.
    Predicates must be relationships between two objects (e. g. object A **speaks to** object B,
    object C **is bigger than** object A). Attributes are qualities, features and properties of individual objects (e. g.
    object A **is green**, object D **is big**). Opt for terms which can later be employed in conversations
    and are more relevant to human users, aim for a bit diverse set of predicate types.
    Output normalized names of predicates and attributes
    (use underscore _ instead of spaces), output their names only (
    speaks_to instead of A_speaks_to_B or speaks_to(A,B) ).

  consolidate_predicates_prompt: >
    Consolidate to broad practical, conversation-relevant predicates (relationships and interactions of two objects),
    normalized with underscore (use underscore _ instead of spaces), output their names only
    ( speaks_to instead of A_speaks_to_B or speaks_to(A,B) ). Output 50 best predicates.
  consolidate_attributes_prompt: >
    Consolidate to broad practical attributes
    (qualities, features and characteristics of objects, such as colors, material or others),
    normalized with underscore (use underscore _ instead of spaces) and is_ prefix where natural ( green -> is_green).
    Output their names only ( is_black instead of black(A) or A_is_black ). Output 25 best attributes.

draft_scene_graph:
  max_image_size: 1024
  enabled: true
  batch_size: 8
  max_concurrent_batches: 64
  save_som_images: true
  som_output_dir: "som_images_draft"
  include_raw_response: true
  som_show_bbox: true
  som_show_mask: false
  som_show_polygon: false
  som_show_labels: true
  som_line_thickness: 2
  som_mask_opacity: 0.5
  som_color_lookup: "index"
  som_mask_backend: "grabcut"
  som_device: "cuda"
  system_prompt: >
    You are an expert Robotic Spatial Intelligence Engine.
    Your task is to analyze a visual scene and produce a machine-readable Scene Graph using object IDs.

    Constraints:
    Strict Vocabulary – Use ONLY the values in the provided PREDICATES and ATTRIBUTES lists. Do not invent new ones.
    Object IDs – Only include objects labeled with numerical IDs visible in the scene.
    Subject-Object Logic – For relationships, the "sub" and "obj" fields must reference different IDs (e.g., (1, holds, 2)).
    Unary Attributes – Represent attributes by setting "sub" and "obj" to the same ID (e.g., (1, is_green, 1) ).
    Exclusivity – Exclude any unlabeled objects, background elements, or inferred items.
    Atomic Relations – Each relation must be atomic (do not combine multiple predicates into one).
    Clarity and Minimalism – Include only meaningful relationships; avoid redundancy.
    Conversation-relevance - Output scene graph which are useful for further grounded conversation.
    Format - Output only **valid** json array!

    {"sub": "ID", "rel": "PREDICATE_or_ATTRIBUTE", "obj": "ID"}
    For predicates: "sub" != "obj"
    For attributes: "sub" = "obj"

    Example Input:
    Image with SoM Prompts + Scene Description + Allowed Predicates and Attributes + Object list

    Example Output:

    [
      {"sub": "1", "rel": "holding", "obj": "2"},
      {"sub": "2", "rel": "red", "obj": "2"},
      {"sub": "3", "rel": "on", "obj": "4"}
    ]
  user_prompt_template: >
    Output scene graph for this image.
    Focus on these Detected Objects: {objects}\n
    Allowed predicates and attributes: {vocabulary}\n
    Image Caption: {caption}

context_rot:
  enabled: false
  min_vocab_size: 10
  step: 5
  strategy: "llm_drop"
  rounds_per_size: 1

prompting:
  include_detection_labels_in_descriptions: true
  include_caption_in_sgg_prompt: true
