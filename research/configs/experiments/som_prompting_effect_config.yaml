  - name: Qwen3_6_35B_A3B_Q4_som_objects_vocab_caption
    overrides:
      experiment_id: Qwen3_6_35B_A3B_Q4
      draft_sgg_model:
        provider: "openai_compatible"
        model_id: "unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_S"
        structured_mode: "instructor"
        base_url: "http://127.0.0.1:8080/v1"
      prompting:
        include_caption_in_sgg_prompt: true
      draft_scene_graph:
        use_som_image: true
        visual_mode: "som"
        som_show_bbox: true
        som_show_labels: true
        som_show_mask: false
        som_show_polygon: false
        user_prompt_template: >
          Focus on spatial, semantic, and functional relationships.
          Provide relations and attributes of the listed objects only.
          Use only the allowed predicates and attributes from the provided list.

          Scene description:
          {caption}

          Objects:
          {objects}

          Allowed relations and attributes:
          {vocabulary}
