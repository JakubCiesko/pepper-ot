name: PepperSoMPromptingEffectMatrix
base_config: eval_sgg_server_like_base.yaml

reuse_artifacts:
  from_run: "research/artifacts/human_eval/vocab/eval_draft_sgg_frozen_vocab_v1"
  files:
    - "detections.json"
    - "descriptions.json"
    - "vocabulary_final.json"

common_overrides:
  name: PepperSoMPromptingEffectMatrix
  paths:
    images_dir: "data/images/eval"
    output_root: "research/artifacts/experiments/som_prompting_effect"
  descriptions:
    enabled: false
  vocabulary:
    enabled: false
  context_rot:
    enabled: false
  evaluation:
    enabled: false
  prompting:
    include_caption_in_sgg_prompt: false
  draft_scene_graph:
    max_concurrent_batches: 4
    som_mask_backend: grabcut
    som_mask_opacity: 0.35
    som_grab_cut_scale: 0.80
    som_grab_cut_iter_count: 10
    som_use_roi_grab_cut: true
    som_max_mask_workers: 4

