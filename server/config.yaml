system:
  language: "en"

detection:
  backend: "rf_detr"
  weights_path: null
  confidence_threshold: 0.60
  run_nms_post_filter: false
  nms_iou_threshold: 0.50
  nms_type: "per_class"
  device: "cuda"
  ontology: null
  ontology_path: "ontology/object_detection.yaml"

tracking:
  max_dormant_frames: 30
  memory_max_age_seconds: 600
  memory_max_objects: 200
  memory_max_relations: 500
  association:
    visual_weight: 0.8
    geometry_weight: 0.2
    match_threshold: 0.4
  feature_extraction:
    device: "cuda"
    reid_model: "nvidia/C-RADIOv4-SO400M"
    target_size: [384, 384]
    resampling_method: "BICUBIC"

scene_graph:
  vlm:
    enabled: true
    provider: "gemini"
    model_id: "gemini-2.5-flash-lite"#"gemini-3.1-flash-lite-preview" #"gpt-5-mini-2025-08-07"
    device: "cuda"
    base_url: null
    api_key_env: "GEMINI_API_KEY" #pragma: allowlist secret
    client_init_kwargs: {}
    call_kwargs: {}
      #temperature: 1.0
      #max_completion_tokens: 4096
    structured_output:
      mode: "provider_native"
      strict: true
    system_prompt:
      path: "prompts/vlm_system_complex.txt"
    user_prompt:
      path: "prompts/vlm_user.txt"
    ontology:
      path: "ontology/scene_generation_ontology.yaml"
  rules:
    enabled: true
    rule_list:
      - predicate: "left_of"
        type: "directional"
        thresholds:
          axis: "x"
          min_delta: -80

      - predicate: "right_of"
        type: "directional"
        thresholds:
          axis: "x"
          max_delta: 80

      - predicate: "above"
        type: "directional"
        thresholds:
          axis: "y"
          max_delta: -35

      - predicate: "below"
        type: "directional"
        thresholds:
          axis: "y"
          min_delta: 35

      - predicate: "near"
        type: "spatial"
        thresholds:
          max_distance: 80

      - predicate: "next_to"
        type: "spatial"
        thresholds:
          min_distance: 10
          max_distance: 65

      - predicate: "far_from"
        type: "spatial"
        thresholds:
          min_distance: 300

      - predicate: "in_front_of"
        type: "overlap"
        thresholds:
          min_iou: 0.85
  reltr:
    enabled: true
    checkpoint_path: detection_models/reltr.pth
    device: "cuda"
    threshold: 0.3
    topk: 100
    iou_match_threshold: 0.5

chat:
  provider: "gemini"
  model_id: "gemini-2.5-flash-lite"#"gpt-4o"
  device: "cuda"
  base_url: null
  api_key_env: "GEMINI_API_KEY" #pragma: allowlist secret
  client_init_kwargs: {}
  call_kwargs: {}
    #temperature: 0.7
    #max_tokens: 256
  structured_output:
    mode: "provider_native"
    strict: true
  system_prompt:
    path: "prompts/chat_system.txt"
  user_prompt:
    path: "prompts/chat_user.txt"
  object_system_prompt:
    path: "prompts/chat_object_system.txt"
  object_user_prompt:
    path: "prompts/chat_object_user.txt"

qa_generation:
  pairs_per_update: 4
  pool_max_entries: 200

visualization:
  show_bbox: true
  show_mask: false
  show_polygon: true
  show_labels: true
  line_thickness: 2
  mask_opacity: 0.5
  color_lookup: "index"
  mask_backend: "grabcut"
  device: "cuda"

storage:
  persist_last_state: false
  last_state_path: "state/last_state.json"
  store_image: false

fusion:
  person_bbox_match_threshold_px: 10
  estimated_person_bbox_base_px: 80
  estimated_person_bbox_min_px: 40
  estimated_person_bbox_max_px: 200

caption:
  provider: local_hf
  model_id: Salesforce/blip-image-captioning-large
  device: cuda
  base_url: null
  api_key_env: null
  timeout_seconds: null
  client_init_kwargs: {}
  call_kwargs: {}
  structured_output:
    mode: parse_output
    strict: true
  mode: unconditional
  max_words: null
  system_prompt:
    text: Describe the visible scene thoroughly but simply.
    path: null
  user_prompt:
    text: What do you see?
    path: null


worker:
  enabled: true
  host: "127.0.0.1"
  port: 8765
  idle_timeout_seconds: 300
  idle_check_interval_seconds: 2.0
  startup_timeout_seconds: 120.0
  request_timeout_seconds: 180.0
  shutdown_grace_seconds: 15.0
  max_startup_queue: 32
  healthcheck_interval_seconds: 2.0
  restart_max_attempts: 3
  restart_window_seconds: 60
  restart_backoff_seconds: [1.0, 3.0, 10.0]
  circuit_breaker_cooldown_seconds: 30
  auto_warmup_on_startup: true

pipeline_controls:
  preset: "full"
  caption: true
  detect: true
  track_memory: true
  paint_som: true
  scene_graph: true
  qa_generation: true
  update_scene_memory: true
