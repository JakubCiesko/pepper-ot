system:
  language: "en"

detection:
  backend: "yolo"
  weights_path: null
  confidence_threshold: 0.30
  device: "cpu"
  ontology: null
  ontology_path: "ontology/object_detection.yaml"

tracking:
  max_dormant_frames: 30
  memory_max_age_seconds: 600
  memory_max_objects: 200
  memory_max_relations: 500
  association:
    visual_weight: 0.8
    geometry_weight: 0.2
    match_threshold: 0.4
  feature_extraction:
    device: "cpu"
    reid_model: "nvidia/C-RADIOv4-SO400M"
    target_size: [384, 384]
    resampling_method: "BICUBIC"

scene_graph:
  mode: "vlm"
  vlm:
    provider: "openai"
    model_id: "gpt-5-mini-2025-08-07"
    device: "cuda"
    base_url: null
    api_key_env: "OPENAI_API_KEY" #pragma: allowlist secret
    client_init_kwargs: {}
    call_kwargs:
      temperature: 1.0
      #max_completion_tokens: 4096
    structured_output:
      mode: "provider_native"
      strict: true
    system_prompt:
      path: "prompts/vlm_system_complex.txt"
    user_prompt:
      path: "prompts/vlm_user.txt"
    ontology:
      path: "ontology/scene_generation_ontology.yaml"
  rules:
    enabled: true
    rule_list:
      - predicate: "next_to"
        type: "spatial"
        thresholds:
          max_distance: 80
        constraints:
          labels_any: []

      - predicate: "left_of"
        type: "directional"
        thresholds:
          axis: "x"
          max_delta: -20

      - predicate: "right_of"
        type: "directional"
        thresholds:
          axis: "x"
          min_delta: 20

      - predicate: "above"
        type: "directional"
        thresholds:
          axis: "y"
          max_delta: -20

      - predicate: "below"
        type: "directional"
        thresholds:
          axis: "y"
          min_delta: 20

      - predicate: "overlapping"
        type: "overlap"
        thresholds:
          min_iou: 0.2

      - predicate: "inside"
        type: "containment"
        thresholds:
          min_inside: 0.6

      - predicate: "touching"
        type: "spatial"
        thresholds:
          max_distance: 10

      - predicate: "near"
        type: "spatial"
        thresholds:
          max_distance: 120

      - predicate: "far_from"
        type: "spatial"
        thresholds:
          min_distance: 250

      - predicate: "aligned_with"
        type: "directional"
        thresholds:
          axis: "y"
          min_delta: -15
          max_delta: 15

      - predicate: "centered_on"
        type: "directional"
        thresholds:
          axis: "x"
          min_delta: -25
          max_delta: 25

      - predicate: "supporting"
        type: "directional"
        thresholds:
          axis: "y"
          min_delta: 10
          max_delta: 80
        constraints:
          labels_any: []

      - predicate: "resting_on"
        type: "directional"
        thresholds:
          axis: "y"
          max_delta: -5
        constraints:
          labels_any: []

      - predicate: "wearing"
        type: "label_pair"
        constraints:
          subject_labels: ["person"]
          object_labels: ["glasses"]

      - predicate: "holding"
        type: "label_pair"
        constraints:
          subject_labels: ["person"]
          object_labels: ["cup", "bottle", "phone", "bag", "book"]

      - predicate: "riding"
        type: "label_pair"
        constraints:
          subject_labels: ["person"]
          object_labels: ["bicycle", "motorcycle", "horse"]

      - predicate: "sitting_on"
        type: "label_pair"
        constraints:
          subject_labels: ["person", "cat", "dog"]
          object_labels: ["chair", "sofa", "bench", "bed"]

      - predicate: "standing_on"
        type: "label_pair"
        constraints:
          subject_labels: ["person"]
          object_labels: ["floor", "ground", "platform", "stage"]

chat:
  provider: "openai"
  model_id: "gpt-4o"
  device: "cuda"
  base_url: null
  api_key_env: "OPENAI_API_KEY" #pragma: allowlist secret
  client_init_kwargs: {}
  call_kwargs:
    temperature: 0.7
    max_tokens: 256
  structured_output:
    mode: "provider_native"
    strict: true
  system_prompt:
    path: "prompts/chat_system.txt"
  context_template:
    path: "prompts/chat_context.txt"

visualization:
  show_bbox: true
  show_mask: false
  show_polygon: true
  show_labels: true
  line_thickness: 2
  mask_opacity: 0.5
  color_lookup: "index"

storage:
  persist_last_state: false
  last_state_path: "state/last_state.json"
  store_image: false

fusion:
  person_bbox_match_threshold_px: 10
  estimated_person_bbox_base_px: 80
  estimated_person_bbox_min_px: 40
  estimated_person_bbox_max_px: 200
