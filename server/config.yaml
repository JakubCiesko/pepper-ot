system:
  language: "en"

detection:
  backend: "rt_detr"
  weights_path: null
  confidence_threshold: 0.5

tracking:
  reid_model: "nvidia/C-RADIOv4-SO400M"
  max_dormant_frames: 30
  memory_max_age_seconds: 60
  memory_max_objects: 200
  memory_max_relations: 500
  association:
    visual_weight: 0.8
    geometry_weight: 0.2
    match_threshold: 0.4

#a.k.a Scene Graph Generation
understanding:
  backend: "openai"
  model_id: "gpt-4o"
  inference:
    temperature: 0.0
    max_tokens: 512
    backend_kwargs: {}
  system_prompt:
    path: "prompts/vlm_system.txt"
  user_prompt:
    text: "Focus on spatial, semantic, and functional relationships."
  ontology:
    path: "ontology/ontology.yaml"

chat:
  backend: "openai"
  model_id: "gpt-4o"
  inference:
    temperature: 0.7
    max_tokens: 256
  system_prompt:
    text: "You are Pepper. Answer based on what you see."
  context_template:
    path: "prompts/chat_context.txt"

# this is relevant for scene graph generation, really affects results!
visualization:
  show_bbox: true
  show_mask: false
  show_polygon: false
  show_labels: true
  line_thickness: 2
  mask_opacity: 0.5
  color_lookup: "index"

storage:
  persist_last_state: true
  last_state_path: "state/last_state.json"
  store_image: true

sgg:
  mode: "hybrid"
  rules:
    enabled: true
    rule_list:
      - predicate: "next to"
        type: "spatial"
        thresholds:
          max_distance: 80
        constraints:
          labels_any: []
      - predicate: "left of"
        type: "directional"
        thresholds:
          axis: "x"
          max_delta: -20
      - predicate: "wearing"
        type: "label_pair"
        constraints:
          subject_labels: ["person"]
          object_labels: ["glasses"]
