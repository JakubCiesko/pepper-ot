            <section id="page-storage" class="page-panel mt-8 hidden">
                <div class="panel border rounded-xl p-5">
                    <h3 class="text-sm uppercase tracking-widest panel-muted mb-4">Storage</h3>
                    <label class="flex items-center gap-2 text-sm">
                        <input id="storage-persist" type="checkbox">
                        Persist last state
                    </label>
                    <p class="text-xs panel-muted mt-1">Saves latest processed state payload to disk after detections.</p>
                    <label class="flex items-center gap-2 text-sm mt-3">
                        <input id="storage-image" type="checkbox">
                        Store image in last state
                    </label>
                    <p class="text-xs panel-muted mt-1">Stores image separately and references it from saved state payload.</p>
                    <label class="block text-sm mt-4" for="storage-path">Last state path</label>
                    <input id="storage-path" type="text" class="w-full border rounded px-3 py-2 mt-1" placeholder="state/last_state.json">
                    <p class="text-xs panel-muted mt-1">Relative location of the persisted last-state JSON file.</p>
                </div>
            </section>
